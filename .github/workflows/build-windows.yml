name: Build Windows

# Build file cài Windows (.exe), chạy kiểm thử và kiểm tra khói trên máy Windows của GitHub,
# rồi đăng bản phát hành (GitHub Release) khi số phiên bản trong apps/desktop/package.json là mới.
# App đã cài tự tải bản phát hành mới nhất. Không dùng API key, không gọi Claude API.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["apps/desktop/**", ".github/workflows/build-windows.yml"]
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:win

      - name: Kiểm tra khói bản chưa cài (win-unpacked)
        run: |
          $exe = Join-Path $PWD "release/win-unpacked/Trung Kien AI Hub.exe"
          $out = Join-Path $PWD "smoke-unpacked.json"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test","--smoke-out=$out" -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "Smoke test thất bại, mã thoát $($p.ExitCode)" }

      - name: Cài im lặng rồi kiểm tra khói bản đã cài
        run: |
          $setup = Get-ChildItem release -Filter "*Setup*.exe" | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Trung Kien AI Hub.exe" | Select-Object -First 1
          if (-not $exe) { throw "Không tìm thấy ứng dụng sau khi cài" }
          Write-Output "Đã cài tại: $($exe.FullName)"
          $out = Join-Path $PWD "smoke-installed.json"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test","--smoke-out=$out" -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "Smoke test bản đã cài thất bại, mã thoát $($p.ExitCode)" }

      - name: Đăng bản phát hành nếu phiên bản mới
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($ver.Contains("-")) { Write-Output "Bản thử $ver, không đăng."; exit 0 }
          $tag = "v$ver"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output "Đã có $tag, không đăng lại."; exit 0 }
          $files = @(Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName })
          Write-Output "Đăng $tag với: $($files -join ', ')"
          gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Trung Kiên AI Hub $ver" --notes "**Tải về:** bấm tệp TrungKienAIHub-Setup-$ver.exe ở mục Assets bên dưới, mở tệp đó để cài (Windows cảnh báo thì bấm Thông tin thêm → Vẫn chạy). Đã cài bản 0.1.0 trở lên thì không cần tải: bấm Kiểm tra cập nhật trong app. Chi tiết thay đổi: ho-so/NHAT-KY.md."
          if ($LASTEXITCODE -ne 0) { throw "Đăng bản phát hành thất bại" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trung-kien-ai-hub-windows
          path: |
            apps/desktop/release/*Setup*.exe
            apps/desktop/smoke-*.json
          if-no-files-found: warn
